<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Kode x Adventure Tribe</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    text-align: center;
}

.container {
    padding: 20px;
}

.logo {
    width: 120px;
    margin: 20px auto;
}

h1 {
    font-size: 22px;
    letter-spacing: 2px;
}

.tagline {
    color: #c2a878;
    margin-bottom: 20px;
}

.product-img {
    width: 100%;
    max-width: 300px;
    border-radius: 10px;
    margin: 15px 0;
}

.button {
    display: block;
    background: #c2a878;
    color: #000;
    padding: 15px;
    margin: 10px auto;
    width: 90%;
    max-width: 300px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 8px;
}

.secondary {
    background: transparent;
    border: 1px solid #c2a878;
    color: #c2a878;
}

.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <img src="YOUR_LOGO_URL" class="logo">

    <h1>ADVENTURE TRIBE</h1>
    <p class="tagline">ESCAPE • CONNECT • EXPLORE</p>

    <img src="YOUR_PRODUCT_IMAGE" class="product-img">

    <h2>Ninja Balaclava Hoodie</h2>
    <p>KSh 6,500</p>

    <a href="https://wa.me/254XXXXXXXXX" class="button">
        ORDER ON WHATSAPP
    </a>

    <a href="#" class="button secondary">
        VIEW FULL COLLECTION
    </a>

    <a href="#" class="button secondary">
        INSTAGRAM PAGE
    </a>

    <div class="footer">
        Nairobi: Pay on Delivery 🚚 <br>
        Outside Nairobi: Deposit Required
    </div>

</div>

</body>
</html>
